<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AZ Tech Mania — Mes heures</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AZ Tech Mania">
<meta name="theme-color" content="#080b0c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preload" href="fonts/PlusJakartaSans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
<header class="top">
  <div class="top-anim" aria-hidden="true"></div>
  <div class="billboard" aria-hidden="true"></div>
  <div class="brand">
    <img src="assets/logo-160.png" alt="AZ Tech" width="44" height="44" class="logo">
    <div class="grow"><h1>AZ Tech <span class="y">Mania</span></h1><p class="sub" id="userName"></p></div>
    <button class="icon-btn" id="settingsBtn" aria-label="Réglages">⚙️</button>
  </div>
  <div class="weeknav">
    <button class="icon-btn" id="prevWeek" aria-label="Semaine précédente">‹</button>
    <label class="weeklabel">
      <span id="weekRange">—</span>
      <input type="date" id="weekPicker" aria-label="Choisir la semaine">
    </label>
    <button class="icon-btn" id="nextWeek" aria-label="Semaine suivante">›</button>
  </div>
</header>

<section class="card settings" id="settings" hidden>
  <h2>Réglages</h2>
  <label class="field"><span>Ton nom (affiché sur le PDF)</span>
    <input type="text" id="setName" placeholder="Ton nom" autocomplete="name" maxlength="60"></label>
  <label class="field"><span><span class="dot" style="background:var(--red)"></span>Heures supp. après (h)</span>
    <input type="number" inputmode="decimal" id="setOver" min="0" step="0.5"></label>
  <p class="note">Heures supp. = heures au-delà de ce seuil, affichées en rouge.</p>
  <h3>Tâches (side jobs)</h3>
  <div id="jobEditor"></div>
  <button class="btn" id="addJob">＋ Ajouter une tâche</button>
  <button class="btn ghost" id="resetJobs">Remettre la liste par défaut</button>
  <div class="row2 mt"><button class="btn" id="setCancel">Annuler</button><button class="btn primary small" id="setSave">Enregistrer</button></div>
</section>

<main id="days"></main>

<section class="card summary" id="summary"></section>

<section class="actions">
  <button class="btn primary" id="pdfBtn">📄 Générer le PDF</button>
  <div class="row2">
    <button class="btn" id="newWeekBtn">➕ Nouvelle semaine</button>
    <button class="btn danger" id="resetBtn">↺ Réinitialiser</button>
  </div>
  <p class="note">Les données restent sur ce téléphone (dans Safari / l’app ajoutée à l’écran d’accueil).</p>
</section>

<canvas id="confetti" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status"></div>

<div class="pdf-preview" id="pdfPreview" hidden role="dialog" aria-modal="true" aria-labelledby="pdfPreviewTitle">
  <div class="pdf-bar top">
    <h2 id="pdfPreviewTitle">Aperçu du PDF</h2>
    <button type="button" class="btn" id="pdfClose">Fermer</button>
  </div>
  <div class="pdf-scroller" id="pdfScroller">
    <p class="pdf-status" id="pdfStatus">Préparation de l’aperçu…</p>
    <div class="pdf-pages" id="pdfPages"></div>
  </div>
  <div class="pdf-bar bottom">
    <button type="button" class="btn primary small" id="pdfShare">Partager</button>
    <button type="button" class="btn" id="pdfDownload">Télécharger</button>
  </div>
</div>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
<script src="vendor/pdf.min.js"></script>
<script src="app.js"></script>
</body>
</html>
